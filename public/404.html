<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuddyBudget</title>
    <script>
      (function () {
        var location = window.location;
        var segmentsToKeep = location.hostname.endsWith('.github.io') ? 1 : 0;
        var base = location.pathname
          .split('/')
          .slice(0, 1 + segmentsToKeep)
          .join('/');
        var route = location.pathname.slice(base.length).replace(/&/g, '~and~');
        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            base +
            '/?/' +
            route +
            (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
            location.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
