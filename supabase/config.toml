project_id = "buddy-budget"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/development.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/reset-password",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/auth/reset-password"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 15
password_requirements = ""

[auth.hook.before_user_created]
enabled = false
uri = "pg-functions://postgres/public/authorize_tester_signup"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

[auth.email.template.confirmation]
subject = "Confirm your Buddy Budget test account"
content_path = "./supabase/templates/auth/v1/confirmation.html"

[auth.email.template.invite]
subject = "You're invited to test Buddy Budget"
content_path = "./supabase/templates/auth/v1/invite.html"

[auth.email.template.magic_link]
subject = "Your Buddy Budget sign-in link"
content_path = "./supabase/templates/auth/v1/magic-link.html"

[auth.email.template.email_change]
subject = "Confirm your Buddy Budget email change"
content_path = "./supabase/templates/auth/v1/email-change.html"

[auth.email.template.recovery]
subject = "Reset your Buddy Budget password"
content_path = "./supabase/templates/auth/v1/recovery.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.share-report]
verify_jwt = false
