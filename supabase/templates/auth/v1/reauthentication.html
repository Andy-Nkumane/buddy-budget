<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #f4f7f4; color: #102a26; font-family: Arial, sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td style="padding: 24px 12px" align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background: #ffffff;
              border: 1px solid #d7e1dc;
              border-radius: 12px;
            "
          >
            <tr>
              <td style="padding: 32px">
                <p style="margin: 0 0 12px; color: #176b5b; font-size: 14px; font-weight: 700">
                  BUDDY BUDGET
                </p>
                <h1 style="margin: 0 0 16px; font-size: 26px; line-height: 1.25">
                  Verify this sensitive change
                </h1>
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6">
                  Enter this verification code only in Buddy Budget:
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    padding: 16px;
                    border-radius: 8px;
                    background: #edf5f2;
                    font-family: monospace;
                    font-size: 28px;
                    font-weight: 700;
                    letter-spacing: 4px;
                    text-align: center;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0 0 12px; font-size: 14px; line-height: 1.6">
                  If you did not request this code, do not use it and contact the authorised test
                  administrator.
                </p>
                <p style="margin: 0; color: #526a65; font-size: 13px; line-height: 1.6">
                  Buddy Budget will never ask you to send this code by email or message.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
