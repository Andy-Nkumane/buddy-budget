<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #f4f7f4; color: #102a26; font-family: Arial, sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td style="padding: 24px 12px" align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background: #ffffff;
              border: 1px solid #d7e1dc;
              border-radius: 12px;
            "
          >
            <tr>
              <td style="padding: 32px">
                <p style="margin: 0 0 12px; color: #176b5b; font-size: 14px; font-weight: 700">
                  BUDDY BUDGET
                </p>
                <h1 style="margin: 0 0 16px; font-size: 26px; line-height: 1.25">
                  Reset your password
                </h1>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.6">
                  Use this link to choose a new Buddy Budget password.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .ConfirmationURL }}"
                    rel="notrack"
                    style="
                      display: inline-block;
                      padding: 13px 20px;
                      border-radius: 8px;
                      background: #155e52;
                      color: #ffffff;
                      font-size: 16px;
                      font-weight: 700;
                      text-decoration: none;
                    "
                    >Reset password</a
                  >
                </p>
                <p style="margin: 0 0 12px; font-size: 14px; line-height: 1.6">
                  If you did not request a password reset, do not use the link. Your existing
                  password remains unchanged.
                </p>
                <p style="margin: 0; color: #526a65; font-size: 13px; line-height: 1.6">
                  Do not forward this message or reply with passwords or verification codes.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
