name: Quality

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Run migration and RLS tests
        run: npm run test:db
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  quality-gate:
    name: Quality gate
    if: always()
    needs: [web, database]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to pass
        env:
          WEB_RESULT: ${{ needs.web.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          if [[ "$WEB_RESULT" != "success" || "$DATABASE_RESULT" != "success" ]]; then
            echo "Web checks: $WEB_RESULT"
            echo "Database checks: $DATABASE_RESULT"
            exit 1
          fi
