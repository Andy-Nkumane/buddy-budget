<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#194f47" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://localhost:54321 http://127.0.0.1:54321 ws://localhost:54321 ws://127.0.0.1:54321; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    />
    <meta name="description" content="Buddy Budget — your calm monthly budgeting companion." />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="stylesheet" href="%BASE_URL%boot-loader.css" />
    <title>Buddy Budget</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Loading Buddy Budget">
        <span class="boot-loader__mark" aria-hidden="true">
          <img
            src="%BASE_URL%icons/icon-192.png"
            alt=""
            width="52"
            height="52"
            fetchpriority="high"
          />
        </span>
        <p>Loading Buddy Budget…</p>
      </div>
      <noscript>
        <p class="boot-loader__noscript">Buddy Budget requires JavaScript to run.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
